name: Build and deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: homepage-server-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and upload website
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out selected branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static website
        env:
          PUBLIC_HELLOFONT_CSS_URL: ${{ vars.PUBLIC_HELLOFONT_CSS_URL }}
        run: npm run build

      - name: Upload website to server
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: bash .github/scripts/deploy.sh
